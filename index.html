<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú Digital</title>
    <meta name="description" content="Menú digital y pedidos directos por WhatsApp para comercios." />
    <meta property="og:title" content="Menú Digital" />
    <meta property="og:description" content="Menú digital y pedidos directos por WhatsApp para comercios." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffc400" />
    <link rel="manifest" id="app-manifest" href="/api/manifest?comercio=lodepichi" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var commerceId = (params.get('comercio') || 'lodepichi').trim().toLowerCase();
        if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(commerceId)) commerceId = 'lodepichi';
        document.getElementById('app-manifest').href =
          '/api/manifest?comercio=' + encodeURIComponent(commerceId);
        var manifestUrl = '/api/manifest?comercio=' + encodeURIComponent(commerceId);
        fetch(manifestUrl)
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (manifest) {
            if (!manifest) return;
            if (manifest.name) document.title = manifest.name;
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle && manifest.short_name) appTitle.setAttribute('content', manifest.short_name);
            var icon = manifest.icons && manifest.icons.find(function (item) { return item.purpose === 'any'; });
            if (icon && icon.src) {
              var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
              if (!appleIcon) {
                appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                document.head.appendChild(appleIcon);
              }
              appleIcon.href = icon.src;
            }
          })
          .catch(function () {});
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Menu" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-100 text-stone-900 font-sans antialiased selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
